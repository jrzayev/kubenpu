version: "2"

run:
  timeout: 5m

linters:
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gosec
    - misspell
    - nilerr
    - revive
    - unconvert
  settings:
    errcheck:
      check-type-assertions: true
    govet:
      enable:
        - shadow
    revive:
      rules:
        - name: exported
          disabled: true
    gosec:
      excludes:
        - G103
        - G304
  exclusions:
    rules:
      - path: bpf_x86_bpfel\.go
        linters:
          - errcheck
          - revive
          - staticcheck
          - unused
      - path: _test\.go
        linters:
          - errcheck
          - gosec
      - path: pkg/podmap/cgroup\.go
        linters:
          - nilerr

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
